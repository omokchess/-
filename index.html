<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잔향선</title>
<meta name="description" content="직업 하나로 끝까지 혼자 싸우는 일대일 턴제 RPG. 로우폴리 벡터 인물, 열 가지 직업 기믹, 열두 잔향체.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#120f22;--bg2:#1a1631;--panel:#211c3c;--panel2:#2b2550;--line:#3a3366;--ink:#efeaff;--mut:#9d95c2;
  --gold:#ffd43b;--brass:#e6b655;--good:#69db7c;--bad:#ff8787;--warn:#ffa94d;--hp:#ff6b6b;--ehp:#e03131;
  --r0:#a9a6ba;--r1:#5aa9ff;--r2:#c084fc;--r3:#ffa94d;
  color-scheme:dark;
}
:root[data-theme="light"]{--bg:#e9e6f2;--bg2:#dcd8ea;--panel:#f8f7fc;--panel2:#e6e2f2;--line:#c9c3dd;--ink:#1c1830;--mut:#6a6485;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(120% 80% at 50% 0%,#241d48 0%,var(--bg) 60%) fixed}
#app{max-width:980px;margin:0 auto;padding:10px 12px 40px}
h1,h2,h3{font-family:'Do Hyeon','Noto Sans KR',sans-serif;font-weight:400;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mut{color:var(--mut)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.btn{display:inline-block;padding:11px 18px;border-radius:12px;background:linear-gradient(180deg,#f0c75e,#c9932c);color:#1b1428;font-family:'Do Hyeon',sans-serif;font-size:19px;box-shadow:0 3px 0 #7a5814,0 6px 16px #0006;transition:transform .08s}
.btn:active{transform:translateY(2px)}.btn:disabled{opacity:.4;filter:grayscale(.6)}
.btn.sm{padding:6px 12px;font-size:15px;box-shadow:0 2px 0 #7a5814}
.btn.ghost,.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:10px;padding:8px 14px}
.ghost.sm{padding:4px 10px;font-size:13px}.ghost.on{background:var(--gold);color:#1b1428;border-color:var(--gold)}
.ghost:disabled{opacity:.4}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.sec{font-family:'Do Hyeon',sans-serif;font-size:20px;margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sec small{font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;margin-right:5px;vertical-align:2px;font-family:'Noto Sans KR',sans-serif;font-weight:700}
.tag.boss{background:#c92a2a;color:#fff}.tag.elite{background:#e67700;color:#fff}
.empty{padding:12px;border:1px dashed var(--line);border-radius:10px;color:var(--mut);font-size:13px}
/* bars */
.bar{position:relative;height:15px;background:#0008;border-radius:8px;overflow:hidden;border:1px solid #fff2}
.bar .fill{height:100%;transition:width .25s}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap}
.bar .shf{position:absolute;top:0;right:0;height:100%;background:repeating-linear-gradient(45deg,#74c0fccc 0 4px,#4dabf7cc 4px 8px)}
.bar.ehp .fill{background:linear-gradient(90deg,#ff6b6b,#c92a2a)}.bar.php .fill{background:linear-gradient(90deg,#69db7c,#2f9e44)}
.bar.xp{height:10px;margin-top:3px}.bar.xp .fill{background:linear-gradient(90deg,#74c0fc,#5f3dc4)}.bar.xp span{font-size:9px}
.bar.stg{height:9px;flex:1}.bar.stg .fill{background:linear-gradient(90deg,#fab005,#ffe066)}.bar.stg span{font-size:9px}
.bar.stg.on{animation:pulse .6s ease-in-out infinite}.bar.stg.on .fill{background:#ffe066}
@keyframes pulse{50%{filter:brightness(1.6)}}
.chips{display:flex;flex-wrap:wrap;gap:3px;min-height:18px}
.chip{display:inline-flex;align-items:center;gap:1px;font-size:11px;padding:0 5px;border-radius:99px;background:#000a;border:1px solid var(--c,#fff3);white-space:nowrap;line-height:17px}
.chip b{font-weight:800;margin-left:2px}.chip i{font-style:normal;opacity:.7;font-size:10px;margin-left:2px}
.chip.st{border-color:var(--c);box-shadow:inset 0 0 6px color-mix(in srgb,var(--c) 40%,transparent)}
.chip.bf.good{border-color:#69db7c99}.chip.bf.bad{border-color:#ff878799}
.res{font-size:10px;padding:0 4px;border-radius:4px;background:#0007;margin-left:2px;white-space:nowrap}
.r-weak{color:#ff922b;font-weight:800}.r-soft{color:#ffd8a8}.r-norm{color:#ced4da}.r-end{color:#a5d8ff}.r-res{color:#748ffc}
.resrow{display:inline-flex;gap:1px;flex-wrap:wrap}
/* title */
.title{position:relative;min-height:calc(100vh - 20px)}
.tarena{position:relative;height:min(46vh,380px);border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 30px #0008}
.tarena canvas{position:absolute;inset:0}
.tlogo{position:relative;margin-top:-92px;text-align:center;pointer-events:none}
.tlogo h1{font-size:68px;line-height:1;color:#fff3bf;text-shadow:0 0 24px #ffd43b88,0 4px 0 #5c3d1a,0 8px 24px #000}
.tsub{font-size:13px;letter-spacing:3px;color:#e6b655;text-shadow:0 2px 4px #000}
.tbody{max-width:560px;margin:18px auto 0;text-align:center}
.tbody .tag{display:block;background:none;font-weight:400;font-size:14px;color:var(--mut);margin:0 0 16px}
.slots{display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c,var(--line));text-align:left}
.slot.empty{justify-content:center;flex-direction:column;align-items:center;padding:16px;border-left-width:1px;border-style:dashed}
.slot.empty small{color:var(--mut)}
.slot .sb{flex:1;display:flex;flex-direction:column}.slot .sb small{color:var(--mut);font-size:12px}
.slot .sbt{display:flex;gap:4px}
.slot canvas{border-radius:10px;background:#0004}
.cloud{margin-top:12px;font-size:12px;color:var(--mut)}
/* pick */
.pgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pc{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-family:'Do Hyeon';font-size:15px}
.pc.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 0 18px color-mix(in srgb,var(--c) 50%,transparent);background:var(--panel2)}
.pc canvas{width:min(72px,100%)!important;height:auto!important;aspect-ratio:1}
.pdet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;margin-top:12px}
.pprev{position:relative;height:340px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.pprev canvas,.cprev canvas{position:absolute;inset:0}
.pinfo h2{font-size:30px;color:var(--c)}.pinfo h2 small{font-size:14px;color:var(--mut);font-family:'Noto Sans KR'}
.ptag{color:var(--mut);margin-bottom:8px}
.pgim{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.pgim b{font-family:'Do Hyeon';font-size:16px;font-weight:400;color:var(--brass)}.pgim p{margin:2px 0 0;font-size:13px}
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin:8px 0}
.statb{display:flex;align-items:center;gap:6px;font-size:12px}.statb span{width:28px;color:var(--mut)}
.sbar{flex:1;height:6px;border-radius:4px;background:#0006}.sbar i{display:block;height:100%;border-radius:4px;background:var(--c)}
.pskills{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:10px}
.psk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.psk b{font-size:13px}.psk small{color:var(--mut);margin-left:4px;font-size:11px}.psk p{margin:2px 0 0;font-size:11.5px;color:var(--mut)}
.psk.ult{border-color:var(--c);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,var(--panel)),var(--panel))}
/* hub */
.hhead{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c)}
.hhead canvas{border-radius:10px;background:#0004}
.hh{flex:1;min-width:0}.hh b{font-family:'Do Hyeon';font-weight:400;font-size:19px}.hh .lv{font-size:13px;color:var(--gold);margin-left:6px}
.cur{display:flex;flex-direction:column;gap:2px;font-weight:700;font-size:13px;text-align:right}
.tabs{display:flex;gap:3px;background:var(--bg2);padding:4px;border-radius:12px;margin:10px 0;position:sticky;top:0;z-index:5;border:1px solid var(--line)}
.tabs button{flex:1;padding:8px 0;border-radius:9px;font-weight:700;font-size:14px;color:var(--mut)}
.tabs button.on{background:var(--panel2);color:var(--ink);box-shadow:0 1px 4px #0006}
.subtabs{display:flex;gap:4px;margin-bottom:10px}.subtabs button{padding:6px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-size:13px}.subtabs button.on{background:var(--gold);color:#1b1428}
.btn.next{width:100%;margin-bottom:10px}.btn.next small{font-family:'Noto Sans KR';font-size:12px;opacity:.8}
.chlist{display:grid;gap:6px}
.ch{border-radius:14px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);overflow:hidden}
.ch.lock{opacity:.45}
.chh{display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;text-align:left}
.chh canvas{border-radius:10px;background:#0004}
.chh div{flex:1;display:flex;flex-direction:column}.chh b{font-family:'Do Hyeon';font-weight:400;font-size:18px}.chh small{color:var(--mut);font-size:12px}
.pips6{display:flex;gap:3px}.pips6 i{width:9px;height:9px;border-radius:2px;background:#fff2;transform:rotate(45deg)}.pips6 i.on{background:var(--c)}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:0 10px 10px}
.stg{position:relative;text-align:left;padding:6px 8px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);display:flex;flex-direction:column}
.stg b{font-family:'Do Hyeon';font-weight:400;color:var(--c)}.stg span{font-size:13px;font-weight:700}.stg small{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg.done{border-color:color-mix(in srgb,var(--c) 50%,transparent)}.stg i{position:absolute;top:4px;right:7px;font-style:normal;color:var(--good)}
.stg.boss{background:linear-gradient(135deg,#3b0d14,var(--bg2))}.stg.elite{background:linear-gradient(135deg,#3b2a0d,var(--bg2))}
.stg:disabled{opacity:.35}
.sinfo .sh{font-family:'Do Hyeon';font-size:20px;color:var(--c)}.sinfo .sl{font-size:13px;margin:4px 0 8px;color:var(--mut)}
.sfoes{display:grid;gap:8px}.sfoe{display:flex;gap:10px;align-items:flex-start;background:var(--bg2);border-radius:12px;padding:6px 8px}
.sfoe canvas{flex:none;background:#0004;border-radius:10px}.sfoe div{display:flex;flex-direction:column;gap:2px}.sfoe small{font-size:12px;color:var(--mut)}.sfoe .gim{color:#ffd8a8}
/* char */
.charscr .cprev{position:relative;height:260px;border-radius:16px;overflow:hidden;border:1px solid var(--line);float:right;width:42%;margin:0 0 8px 10px}
.stt{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:13px}.stt span{background:var(--panel);border-radius:8px;padding:5px 8px;color:var(--mut)}.stt b{color:var(--ink);float:right}
.gslots,.bag{display:grid;gap:5px;clear:both}
.gear{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:11px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--rc,var(--line))}
.gear.r0{--rc:var(--r0)}.gear.r1{--rc:var(--r1)}.gear.r2{--rc:var(--r2)}.gear.r3{--rc:var(--r3);background:linear-gradient(135deg,color-mix(in srgb,var(--r3) 14%,var(--panel)),var(--panel))}
.gear .gi{font-size:20px;width:26px;text-align:center}.gear .gb{flex:1;min-width:0}.gear .gn{font-weight:700;font-size:14px}.gear .gn small{font-weight:400;color:var(--mut);font-size:11px}
.gear .gm{font-size:12px}.gear .ga{font-size:11.5px;color:#c5f6fa}
.gbt{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.gear.trophy-slot{display:block;font-size:13px;border-left-color:var(--gold)}.gear.trophy-slot select{margin-left:6px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.gear .sold{font-size:11px;color:var(--warn)}
.skills{display:grid;gap:5px}.skrow{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
.skrow p{margin:2px 0 0;font-size:12px;color:var(--mut)}.skrow small{color:var(--brass)}.skrow.lock{opacity:.5}
.tals{display:grid;gap:6px}.tal{display:grid;grid-template-columns:44px 1fr 1fr;gap:5px;align-items:stretch}.tal.lock{opacity:.45}
.tl{display:flex;align-items:center;justify-content:center;font-family:'Do Hyeon';color:var(--brass)}
.tbtn{text-align:left;padding:7px 9px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column}.tbtn small{font-size:11.5px;color:var(--mut)}
.tbtn.on{border-color:var(--gold);background:linear-gradient(135deg,#4a3a10,var(--panel))}
.shop{display:grid;gap:6px}.sitem{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.sitem small{grid-column:1;font-size:12px;color:var(--mut)}.sitem span{font-size:12px;color:var(--mut)}
.achl{display:grid;grid-template-columns:1fr 1fr;gap:5px}.ach{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 9px;opacity:.55;display:flex;flex-direction:column}.ach.on{opacity:1;border-color:var(--gold)}.ach small{font-size:11.5px;color:var(--mut)}
.bestl{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:5px}
.bst{display:flex;flex-direction:column;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}.bst b{font-size:12px;text-align:center}.bst small{font-size:10px;color:var(--mut)}
.bst .q,.pax .q{width:64px;height:72px;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--mut)}
.bst.unk{opacity:.5}
.paxl{display:grid;gap:6px}.pax{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px}.pax div{display:flex;flex-direction:column}.pax small{font-size:12px;color:var(--mut)}.pax.unk{opacity:.5}.pax .q{width:60px;height:60px}
.bdet{display:flex;gap:12px}.bdet p{font-size:13px}.bdet .sks{display:flex;flex-direction:column}
.sets{display:grid;gap:6px}.setr{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;flex-wrap:wrap}
.setr div{display:flex;flex-direction:column}.setr small{font-size:12px;color:var(--mut)}
.opts{display:flex;flex-direction:row!important;gap:4px;flex-wrap:wrap}.opts button{padding:5px 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:13px}.opts button.on{background:var(--gold);color:#1b1428}
textarea.code{width:100%;height:120px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:8px;font-size:11px}
/* lab */
.labintro{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.labintro h3{font-size:24px;color:#b197fc}.labintro p,.labintro li{font-size:13.5px}
.labbest{margin:8px 0}
.lhead{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.ldepth{display:flex;flex-direction:column;align-items:center;font-family:'Do Hyeon';line-height:1}.ldepth b{font-size:36px;color:#b197fc;font-weight:400}.ldepth small{font-size:11px;color:var(--mut)}
.lst{flex:1}.ltok{font-size:12.5px;color:var(--mut);margin-top:4px}
.relics{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.relic{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:16px}
.relic.r1{border-color:var(--r1)}.relic.r2{border-color:var(--r3)}.relic.r3{border-color:var(--gold)}
.nodes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.node{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 6px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-height:120px}
.node b{font-size:28px}.node span{font-family:'Do Hyeon';font-size:18px}.node small{font-size:11.5px;color:var(--mut)}
.node.n-elite{border-color:#e67700}.node.n-boss{border-color:#c92a2a;background:linear-gradient(180deg,#3b0d14,var(--panel))}.node.n-rest{border-color:#2f9e44}.node.n-shop{border-color:#1c7ed6}
.rpick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.rp{display:flex;flex-direction:column;text-align:left;padding:8px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}.rp small{font-size:11.5px;color:var(--mut)}.rp span{font-size:12px;color:var(--gold);margin-top:3px}
.rp.r1{border-color:var(--r1)}.rp.r2{border-color:var(--r3)}.rp.sold{opacity:.35}
.ev{font-size:14px}.evo{display:grid;gap:6px}
/* modal / toast / tip */
#modal{position:fixed;inset:0;background:#05030dcc;display:flex;align-items:center;justify-content:center;z-index:80;padding:14px;backdrop-filter:blur(2px)}
#modal .in{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 20px 60px #000}
#modal.wide .in{max-width:640px}
#modal h3{font-size:22px;margin-bottom:8px}
.mbtns{display:flex;gap:6px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.itemlist{display:grid;gap:5px}.itemlist .item{display:flex;flex-direction:column;text-align:left;padding:8px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}.itemlist small{color:var(--mut);font-size:12px}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:90;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px #0008;transition:opacity .3s,transform .3s}
.toast.good{border-color:var(--good)}.toast.bad{border-color:var(--bad)}.toast.out{opacity:0;transform:translateY(8px)}
#tip{position:fixed;display:none;max-width:280px;background:#0b0818f2;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12.5px;z-index:95;pointer-events:none;box-shadow:0 8px 24px #000a;line-height:1.4}
/* result */
.result h2{font-size:34px;text-align:center}.result.win h2{color:var(--gold);text-shadow:0 0 18px #ffd43b66}.result.lose h2{color:var(--bad)}
.rstat{text-align:center;font-size:12px;color:var(--mut);margin:4px 0 8px}
.rrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}.rrow span{background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-weight:700;font-size:13px}
.rrow .lvup{background:var(--gold);color:#1b1428;border-color:var(--gold)}
.trophy{text-align:center;background:linear-gradient(135deg,#4a3a10,var(--bg2));border:1px solid var(--gold);border-radius:12px;padding:8px;margin:8px 0}.trophy small{display:block;font-size:12px;color:var(--mut)}

const IDLE = {
  breath: t => ({ y: Math.sin(t / 420) * 1, aR: Math.sin(t / 420 + 1) * 2, aL: Math.sin(t / 420 + 2) * 2 }),
  heavy: t => ({ y: Math.sin(t / 560) * 1.4, lean: Math.sin(t / 560) * 1.2, aR: Math.sin(t / 560 + 1) * 2 }),

  none: () => ({}),

const POSE_KEYS = ['dx', 'dy', 'rot', 'lean', 'crouch', 'hd', 'aR', 'wR', 'aL', 'wL', 'lL', 'lR', 'glow', 'alpha', 'sx', 'sy', 'open', 'wing', 'arm', 'arm2', 'pupX', 'pupY', 'pupR', 'jaw', 'tail'];

const RIG = {
  actors: [],
  make(o) {
    const a = Object.assign({ x: 0, y: 0, face: 1, sc: 1, hold: null, anim: null, flashT: 0, hurtT: 0, t0: 0, box: { w: 50, h: 90 } }, o);
    a.cur = this.base(a); return a;
  },
  base(a) {
    const p = zeroPose();
    const h = (a.look && a.look.hold) || {};
    for (const k in h) if (k in p) p[k] = h[k];
    if (a.hold) for (const k in a.hold) p[k] = a.hold[k];
    return p;
  },
  /* 동작 재생: frames = [[ms, {값}], ...]. 시작점은 현재 자세. hitAt(ms)에 약속이 풀린다 */
  play(a, name, o = {}) {
    if (!a) return Promise.resolve();
    const set = (a.look && a.look.anims) || {};
    const fn = set[name] || (a.kind === 'hero' ? HERO_ANIM[name] : null) || FOE_ANIM[name] || HERO_ANIM[name];
    if (!fn) return Promise.resolve();
    const spec = fn(a, o) || { frames: [] };
    if (spec.hold !== undefined) a.hold = spec.hold;
    return new Promise(res => {
      if (a.anim && a.anim.res) a.anim.res();
      a.anim = { from: Object.assign({}, a.cur), frames: spec.frames, t0: RIG.now(), res, hitAt: spec.hitAt, done: false };
      if (spec.hitAt != null) setTimeout(() => res(), spec.hitAt / RIG.speed);
      if (!spec.frames.length) res();
    });
  },
  speed: 1,
  _vt: 0, _lp: null,
  now() { const t = typeof performance !== 'undefined' ? performance.now() : Date.now(); if (this._lp == null) { this._lp = t; this._vt = t; } this._vt += (t - this._lp) * this.speed; this._lp = t; return this._vt; },
  pose(a, now) {
    const base = this.base(a);
    let p = base;
    if (a.anim) {
      const an = a.anim, t = now - an.t0, fr = an.frames;
      const pts = [[0, an.from]];
      for (const [ms, q] of fr) pts.push([ms, Object.assign({}, base, q)]);
      const end = pts[pts.length - 1][0];
      if (t >= end) { p = Object.assign({}, base); a.anim = null; an.res(); }
      else {
        let i = 0; while (i < pts.length - 1 && pts[i + 1][0] < t) i++;
        const [t0, A] = pts[i], [t1, B] = pts[i + 1];
        const k = easeIO(clamp((t - t0) / Math.max(1, t1 - t0), 0, 1));
        p = {}; for (const key of POSE_KEYS) { const va = A[key] == null ? base[key] : A[key], vb = B[key] == null ? base[key] : B[key]; p[key] = va + (vb - va) * k; }
      }
    }
    a.cur = p;
    const q = Object.assign({}, p);
    const T = now - a.t0;
    if (q.alpha > 0.4 && !(a.hold && a.hold.rot) && !a.dead) {
      const id = (IDLE[(a.look && a.look.idle) || 'breath'] || IDLE.breath)(T);
      for (const k in id) { if (k === 'y') q.dy += id.y; else q[k] = (q[k] || 0) + id[k]; }
    }
    return q;
  },
  /* 한 인물을 그린다 (c: 캔버스, dpr) */
  draw(c, a, q, now, dpr) {
    const op = clamp(q.alpha, 0, 1);
    if (op <= 0.02) return;
    c.save(); c.globalAlpha = op;
    c.translate(a.x + q.dx * a.face, a.y + q.dy);
    if (q.rot) c.rotate(q.rot * VR.DG * a.face);
    c.scale(a.face * a.sc * q.sx, a.sc * q.sy);
    VR.use(c, a.sc * dpr);
    VR.flash(a.flashT > now ? 0.75 : 0);
    VR.rim(q.glow > 0.5 ? (a.rimC || (a.look && a.look.el) || '#ffffff') : null);
    VR.tint(a.tintC || null, a.tintA || 0);
    VR.tip = (x, y) => { a.tip = [x / dpr, y / dpr]; };
    const hp = Object.assign({}, q, { x: 0, y: 0, hurt: a.hurtT > now });
    if (a.kind === 'hero' || a.look.human) VR.human(a.look, hp, now - a.t0);
    else if (a.look.draw) a.look.draw(hp, now - a.t0, a);
    VR.rim(null); VR.flash(0); VR.tint(null); VR.tip = null;
    c.restore();
  },
};

const Stage = {
  cv: null, c: null, W: 360, H: 360, dpr: 1, me: null, foe: null, raf: 0, bg: null, motes: [], theme: 'ash', fps: 24, lastQ: -1, extra: [], rain: [],
  mount(host, theme, heroLook, foeLook, o = {}) {

  },

    this.W = W; this.H = H; this.dpr = Math.min(2, (typeof devicePixelRatio !== 'undefined' && devicePixelRatio) || 1);
    this.k = clamp(Math.min(W / 400, H / 380), 0.75, 1.35);
    const dw = Math.ceil(W * this.dpr), dh = Math.ceil(H * this.dpr);
    this.cv.width = dw; this.cv.height = dh; this.cv.style.width = W + 'px'; this.cv.style.height = H + 'px';
    this.bg = document.createElement('canvas'); this.bg.width = dw; this.bg.height = dh;

    const th = BGTH[this.theme] || BGTH.ash;
    this.motes = []; for (let i = 0; i < 18; i++) this.motes.push({ x: Math.random() * W, y: Math.random() * H, v: 0.1 + Math.random() * 0.25, p: Math.random() * 7, s: 1.5 + Math.random() * 1.6, c: th.mote });
    this.rain = th.rain ? Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * H, v: 6 + Math.random() * 5 })) : [];
    if (!first) {
      const k = this.k;
      if (this.me && this.preview) { this.me.x = W * 0.5; this.me.y = H * 0.84; this.me.sc = Math.min(2.4, H / 120); }
      else if (this.me) { this.me.x = W * 0.25; this.me.y = H * 0.84; this.me.sc = 1.42 * k; }
      if (this.foe) { const L = this.foe.look; this.foe.x = W * 0.72; this.foe.y = H * (L.boss ? 0.8 : 0.82); this.foe.sc = (L.sc || 1.4) * k; }
    }
  },
  unmount() { if (this.cv && this.cv.parentNode) this.cv.parentNode.removeChild(this.cv); this.cv = null; this.me = null; this.foe = null; },
  loop(t) {

    this.raf = requestAnimationFrame(tt => this.loop(tt));
    const q = this.fps >= 60 ? 1 : 1000 / this.fps;
    const now = Math.floor(RIG.now() / q) * q;

    const d = this.c, W = this.W, H = this.H;
    d.setTransform(1, 0, 0, 1, 0, 0); d.clearRect(0, 0, this.cv.width, this.cv.height);
    if (this.shakeT > now) { const s = this.shakeP * (this.shakeT - now) / this.shakeD; d.translate((Math.random() - 0.5) * s * this.dpr, (Math.random() - 0.5) * s * this.dpr); }
    d.drawImage(this.bg, 0, 0);
    d.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    for (const m of this.motes) {
      m.y -= m.v * 4; m.x += Math.sin(now / 700 + m.p) * 0.5; if (m.y < 0) { m.y = H * (0.5 + Math.random() * 0.5); m.x = Math.random() * W; }

      for (let i = 0; i < 3; i++) { const b = a + i * 2.094; i ? d.lineTo(m.x + Math.cos(b) * s, m.y + Math.sin(b) * s) : d.moveTo(m.x + Math.cos(b) * s, m.y + Math.sin(b) * s); }

    }

    if (this.rain.length) { d.strokeStyle = 'rgba(200,215,235,.35)'; d.lineWidth = 1; d.beginPath(); for (const r of this.rain) { r.y += r.v; r.x -= r.v * 0.25; if (r.y > H) { r.y = -10; r.x = Math.random() * W * 1.2; } d.moveTo(r.x, r.y); d.lineTo(r.x + 3, r.y - 12); } d.stroke(); }
    if (this.under) try { this.under(d, now); } catch (e) { /* 연출 오류는 무시 */ }

    }
    for (const [a, p] of poses) {
      RIG.draw(d, a, p, now, this.dpr);

      if (a.stun) { const x = a.x + p.dx * a.face, y = a.y + p.dy - a.box.h * a.sc - 8; VR.use(d, this.dpr); for (let i = 0; i < 3; i++) { const an = now / 300 + i * 2.1; VR.star(x + Math.cos(an) * 20, y + Math.sin(an) * 6, 5, '#ffd43b'); } }
    }
    if (this.over) try { this.over(d, now); } catch (e) { /* 연출 오류는 무시 */ }
  },
  shake(p, d) { this.shakeP = p; this.shakeD = d; this.shakeT = RIG.now() + d; },
  /* 화면(클라이언트) 좌표: 몸 중심·머리 위·발밑·무기 끝 */
  pt(a, where = 'c') {

  },

  dist(from, to) { if (!from || !to) return 100; return Math.max(30, Math.abs(to.x - from.x) - (to.box.w * to.sc * 0.5 + from.box.w * from.sc * 0.4) - 8); },
};

  duelist: ['du_lunge', 'du_feint', 'du_flurry', 'du_stance', 'du_duel', 'du_ult'],
  bulwark: ['bw_bash', 'bw_wall', 'bw_crash', 'bw_taunt', 'bw_vow', 'bw_ult'],

/* ===== 직업별 자동 전투 판단 (has(id) → 쓸 수 있으면 그 기술) ===== */
CLASSES.hemoblade.ai = (B, has) => {
  const p = B.p, b = B.f.st.bleed;
  if (has('hb_ult') && B.r.tide >= 7) return 'hb_ult';
  if (has('hb_hemo') && b && b.p * b.c >= 18) return 'hb_hemo';
  if (has('hb_let') && p.hp > p.mhp * 0.65 && B.r.tide <= 6) return 'hb_let';
  if (has('hb_thrust') && p.hp > p.mhp * 0.35) return 'hb_thrust';
  if (has('hb_waltz')) return 'hb_waltz';
  if (has('hb_ult')) return 'hb_ult';
  return 'hb_line';
};
CLASSES.ember.ai = (B, has) => {
  const p = B.p, b = B.f.st.burn;
  if (has('em_ult')) return 'em_ult';
  if (has('em_ash') && (B.r.heat >= 125 || (p.hp < p.mhp * 0.4 && B.r.heat >= 30))) return 'em_ash';
  if (has('em_purge') && b && b.p * Math.min(6, b.c) >= 18) return 'em_purge';
  if (has('em_flurry')) return 'em_flurry';
  if (has('em_bapt')) return 'em_bapt';
  return 'em_spark';
};
CLASSES.bell.ai = (B, has, ok) => {
  const want = B.r.beat + 1;
  if (has('bl_ult') && (B.r.beat === 0 || B.r.big)) return 'bl_ult';
  if (has('bl_hush') && want === 1 && B.threat() > 0.2) return 'bl_hush';
  const tone = ok.filter(u => u.sk.tone === want).sort((a, b) => b.cost - a.cost);
  if (tone.length) return tone[0].id;
  return 'bl_toll';
};
CLASSES.duelist.ai = (B, has) => {
  if (has('du_ult') && B.r.mo >= 7) return 'du_ult';
  if (has('du_stance') && B.threat() > 0.14) return 'du_stance';
  if (has('du_duel') && !B.bfv(B.f, 'vuln')) return 'du_duel';
  if (has('du_flurry')) return 'du_flurry';
  if (has('du_feint')) return 'du_feint';
  if (has('du_ult')) return 'du_ult';
  return 'du_lunge';
};
CLASSES.bulwark.ai = (B, has) => {
  const p = B.p;
  if (has('bw_vow') && p.hp < p.mhp * 0.35) return 'bw_vow';
  if (has('bw_ult') && B.r.end >= 60) return 'bw_ult';
  if (has('bw_wall') && B.threat() > 0.15) return 'bw_wall';
  if (has('bw_taunt') && B.threat() > 0.1) return 'bw_taunt';
  if (has('bw_crash')) return 'bw_crash';
  return 'bw_bash';
};
CLASSES.gambler.ai = (B, has) => {
  if (B.r.jack && has('gb_ult')) return 'gb_ult';
  if (B.r.jack && has('gb_allin')) return 'gb_allin';
  if (has('gb_sleight') && (has('gb_ult') || B.p.en >= 4)) return 'gb_sleight';
  if (has('gb_ult') && B.r.rig >= 2) return 'gb_ult';
  if (has('gb_allin')) return 'gb_allin';
  if (has('gb_edge') && B.threat() > 0.15) return 'gb_edge';
  if (has('gb_coin')) return 'gb_coin';
  return 'gb_toss';
};
CLASSES.poet.ai = (B, has) => {
  const p = B.p, s = B.f.st.sinking;
  if (has('po_ult')) return 'po_ult';
  if (has('po_surface') && p.hp < p.mhp * 0.35) return 'po_surface';
  if (has('po_drown') && s && s.p * s.c >= 16) return 'po_drown';
  if (has('po_jelly') && !B.r.jelly) return 'po_jelly';
  if (has('po_meter')) return 'po_meter';
  return 'po_verse';
};
CLASSES.gunner.ai = (B, has) => {
  const ch = B.stp(B.p, 'charge');
  if (B.r.ammo < 1 && has('gn_reload')) return 'gn_reload';
  if (has('gn_ult') && ch >= 9) return 'gn_ult';
  if (has('gn_charge') && ch < 9) return 'gn_charge';
  if (has('gn_ap')) return 'gn_ap';
  if (has('gn_buck')) return 'gn_buck';
  if (has('gn_ult')) return 'gn_ult';
  if (B.r.ammo < 2 && has('gn_reload') && B.p.en < 2) return 'gn_reload';
  return 'gn_shot';
};
CLASSES.puppeteer.ai = (B, has) => {
  if (has('pp_mend') && B.r.doll < 35) return 'pp_mend';
  if (has('pp_dance') && B.threat() > 0.12) return 'pp_dance';
  if (has('pp_ult') && B.r.doll >= 60) return 'pp_ult';
  if (has('pp_tangle')) return 'pp_tangle';
  if (has('pp_charge')) return 'pp_charge';
  return 'pp_pull';
};
CLASSES.clock.ai = (B, has) => {
  const p = B.p;
  if (has('ck_rewind') && B.hpAgo(2) - p.hp > p.mhp * 0.25) return 'ck_rewind';
  if (has('ck_stop') && B.threat() > 0.3) return 'ck_stop';
  if (has('ck_ult') && B.r.wind >= 5) return 'ck_ult';
  if (has('ck_over') && !B.bfv(p, 'haste')) return 'ck_over';
  if (has('ck_second')) return 'ck_second';
  return 'ck_cog';
};

      else if (this.tgt === -1 && f.parts.some(q => q.alive) && !f.D.noPartAi) return { k: 'target', i: f.parts.findIndex(q => q.alive) };

  }
  /* 다음 적 행동이 얼마나 아플지 (최대 체력 비율) */
  threat() { const pl = this.f && this.f.plan[0]; if (!pl) return 0; let t = 0; for (const a of pl) { if (a.ch > 1 || a.id === '_stagger') continue; t += this.estFoe(this.fsk(a.id), a); } return t / this.p.mhp; }
  /* 자동 방어 판정 (빠른 반응 끔 · 시뮬레이션) */
  autoDef(q) {

    const p = this.p;

  }

const CH_BY_ID = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const chLv = ch => 1 + (ch - 1) * 5;
const NM_ADD = 12;
const LV_CAP = 70;

/* 장의 스테이지: 1 단독 · 2 연전 · 3 단독 · 4 정예 · 5 연전 · 6 잔향체 */
function stageList(ch, nm) {
  const C = CH_BY_ID[ch], b = chLv(ch) + (nm ? NM_ADD : 0), [a, bb, c] = C.set;
  const L = v => Math.min(LV_CAP, v);
  return [
    { k: 1, n: '진입', foes: [a], lv: L(b) },
    { k: 2, n: '연전', foes: [bb, c], lv: L(b + 1) },
    { k: 3, n: '잔향의 길', foes: [c], lv: L(b + 1) },
    { k: 4, n: '정예', foes: [C.elite], lv: L(b + 2), elite: 1, story: 'mid' },
    { k: 5, n: '삼연전', foes: [a, bb, c], lv: L(b + 3) },
    { k: 6, n: C.boss ? FOES[C.boss].n : '잔향체', foes: [C.boss], lv: L(b + 4), boss: 1, story: 'bossIntro' },
  ].map(s => Object.assign(s, { ch, nm: !!nm, id: `${nm ? 'n' : 's'}${ch}-${s.k}` }));
}

'use strict';
/* ===== 잔향선 · 진행 (저장 슬롯 · 성장 · 장비 · 보상 · 미궁) ===== */

const SAVE_KEY = 'echoline_solo_v2';
const SLOT_N = 3;
const ITEM_PRICE = { potion: 25, tonic: 30, ether: 35, bomb: 40, elixir: 220 };
const BAG_MAX = 40;

function xpNeed(L) { return Math.round(160 + 40 * L + 0.2 * L * L); }
function newSlot(cls) {
  return {
    v: 2, cls, created: Date.now(), playtime: 0, lvl: 1, xp: 0, shards: 60, crystals: 0,
    gear: { weapon: null, armor: null, charm: null }, trophy: null, bag: [], tal: [null, null, null], ranks: {},
    items: { potion: 3, tonic: 1, ether: 1, bomb: 0, elixir: 0 },
    story: { prog: {}, nmProg: {}, boss: {}, nmBoss: {}, read: {} },
    seen: {}, lab: { best: 0, runs: 0, run: null }, ach: {},
    stats: { wins: 0, losses: 0, perfect: 0, staggers: 0, maxHit: 0, legend: 0, maxPlus: 0, jackpots: 0, flawless: 0, fastBoss: 0, maxRelics: 0, kills: 0 },
  };
}
function newRoot() { return { v: 2, cur: null, slots: [null, null, null], settings: { speed: 1, qte: true, fps: 24, shake: true, auto: false, hint: true }, savedAt: 0 }; }

/* claude.ai 안에서 열면 계정별 비공개 문서에 저장을 한 부 더 둔다. 쓸 수 없는 환경에서는 브라우저 저장만 쓴다. */
const Cloud = {
  ref: null, ready: false, busy: false, pending: false, timer: 0, last: '', remote: null, state: 'off',
  async init(onRemote) {
    try {
      const c = typeof window !== 'undefined' && window.claude;
      if (!c || !c.use) return;
      const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.ref = db.doc('data/users/' + id + '/solo');
      const snap = await this.ref.get();
      if (snap.exists) { const d = snap.data(); if (d && typeof d.json === 'string') { this.remote = d; this.last = d.json; } }
      this.state = 'on'; this.ready = true;
      if (this.remote && onRemote) onRemote(this.remote);
      this.push();
    } catch (e) { this.ref = null; this.state = 'off'; }
  },
  schedule() { if (!this.ref || !this.ready) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 4000); },
  async push() {
    if (!this.ref || !this.ready || !Game.root) return;
    if (this.busy) { this.pending = true; return; }
    const json = JSON.stringify(Game.root);
    if (json === this.last) return;
    this.busy = true;
    try { await this.ref.set({ json, at: Game.root.savedAt || Date.now(), v: 2 }); this.last = json; this.state = 'on'; }
    catch (e) { const code = e && e.code; if (code === 'unavailable' || code === 'resource_exhausted') this.pending = true; else { this.ref = null; this.state = 'off'; } }
    this.busy = false;
    if (this.pending && this.ref) { this.pending = false; this.schedule(); }
  },
};

const Game = {
  root: null,
  get s() { return this.root && this.root.cur != null ? this.root.slots[this.root.cur] : null; },
  get set() { return this.root.settings; },
  load() {
    try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { this.root = this.migrate(JSON.parse(raw)); return true; } } catch (e) { /* 저장소를 쓸 수 없는 환경 */ }
    this.root = newRoot(); return false;
  },
  migrate(r) {
    const d = newRoot();
    for (const k in d) if (r[k] === undefined) r[k] = d[k];
    for (const k in d.settings) if (r.settings[k] === undefined) r.settings[k] = d.settings[k];
    r.slots = (r.slots || []).concat([null, null, null]).slice(0, SLOT_N).map(s => {
      if (!s) return null;
      const n = newSlot(s.cls);
      for (const k in n) if (s[k] === undefined) s[k] = n[k];
      for (const k in n.stats) if (s.stats[k] === undefined) s.stats[k] = n.stats[k];
      for (const k in n.story) if (!s.story[k]) s.story[k] = {};
      for (const k in n.items) if (s.items[k] === undefined) s.items[k] = 0;
      return s;
    });
    return r;
  },
  save() {
    if (!this.root) return;
    this.root.savedAt = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.root)); } catch (e) { /* 저장 실패는 조용히 넘긴다 */ }
    Cloud.schedule();
  },
  createSlot(i, cls) {
    const s = newSlot(cls);
    const L = 1;
    s.gear.weapon = rollGear('weapon', L, 0); s.gear.armor = rollGear('armor', L, 0);
    this.root.slots[i] = s; this.root.cur = i; this.save(); return s;
  },
  useSlot(i) { if (this.root.slots[i]) { this.root.cur = i; this.save(); } },
  deleteSlot(i) { this.root.slots[i] = null; if (this.root.cur === i) this.root.cur = null; this.save(); },
  tick(sec) { if (this.s) this.s.playtime += sec; },

  /* ---------- 능력치 ---------- */
  stats(extra) {
    const s = this.s, c = CLASSES[s.cls].stat, g = lvG(s.lvl);
    const o = { mhp: 220 * g * c.hp, atk: 10 * g * c.atk, def: 10 * g * c.def, spd: (20 + s.lvl * 0.6) * c.spd, crit: 5, critDmg: 1.5, enStart: 0, qte: 0, stg: 0, heal: 0, stPot: 0 };
    let P = { atkP: 0, hpP: 0, defP: 0 };
    for (const k of ['weapon', 'armor', 'charm']) {
      const it = s.gear[k]; if (!it) continue;
      const m = gearMain(it); if (m.atk) o.atk += m.atk; if (m.hp) o.mhp += m.hp; if (m.def) o.def += m.def;
      for (const [ak, v] of it.ax) {
        if (ak in P) P[ak] += v;
        else if (ak === 'crit') o.crit += v; else if (ak === 'critDmg') o.critDmg += v / 100; else if (ak === 'spd') o.spd += v;
        else if (ak === 'enStart') o.enStart += v; else if (ak === 'qte') o.qte += v / 100; else if (ak === 'stg') o.stg += v / 100; else if (ak === 'heal') o.heal += v / 100; else if (ak === 'stPot') o.stPot += v;
      }
    }
    o.atk *= 1 + P.atkP / 100; o.mhp *= 1 + P.hpP / 100; o.def *= 1 + P.defP / 100;
    if (extra) { if (extra.atkB) o.atk *= 1 + extra.atkB; if (extra.hpB) o.mhp *= 1 + extra.hpB; if (extra.critB) o.crit += extra.critB; if (extra.maxHp) o.mhp *= 1 + extra.maxHp; }
    o.mhp = Math.round(o.mhp); o.atk = Math.round(o.atk * 10) / 10; o.def = Math.round(o.def * 10) / 10; o.spd = Math.round(o.spd);
    return o;
  },
  power() { const o = this.stats(); return Math.round(o.atk * 10 + o.mhp / 4 + o.def * 6 + o.crit * 4); },
  skills() { const s = this.s; return CLASSES[s.cls].skills.filter(k => k.unlock <= s.lvl).map(k => ({ id: k.id, rank: s.ranks[k.id] || 1 })); },
  look() { return Object.assign({ seed: 7 }, HERO_LOOK[this.s.cls]); },
  /* 장비 효과를 전투에 넘기는 가상 유물 */
  gearRelics() {
    const s = this.s, list = [];
    if (s.trophy && s.story.boss[s.trophy]) list.push('t_' + s.trophy);
    return list;
  },
  battleHero(o = {}) {
    const s = this.s, st = this.stats(o.bonus);
    const tal = s.tal.filter(Boolean);
    return {
      cls: s.cls, lv: s.lvl, stats: st, skills: this.skills(), tal, relics: (o.relics || []).concat(this.gearRelics()).concat(st.enStart || st.qte || st.stg || st.heal || st.stPot ? ['_gear'] : []),
      items: o.items || Object.assign({}, s.items), hp: o.hp, sp: o.sp, gear: st,
    };
  },

  /* ---------- 이야기 진행 ---------- */
  progKey(nm) { return nm ? 'nmProg' : 'prog'; },
  cleared(ch, nm) { return this.s.story[this.progKey(nm)][ch] || 0; },
  chapterOpen(ch, nm) { if (nm && !this.s.story.boss.lethe) return false; return ch === 1 || this.cleared(ch - 1, nm) >= 6; },
  stageOpen(st) { return this.chapterOpen(st.ch, st.nm) && this.cleared(st.ch, st.nm) >= st.k - 1; },
  nextStage() {
    for (const nm of [false, true]) for (const C of CHAPTERS) { if (!this.chapterOpen(C.id, nm)) continue; const c = this.cleared(C.id, nm); if (c < 6) return stageList(C.id, nm)[c]; }
    return null;
  },
  battleConfig(st) {
    const foes = st.foes.map(id => ({ id, lv: st.lv, nm: st.nm }));
    return { seed: Date.now() & 0xffffff, hero: this.battleHero(), foes };
  },
  /* 전투 결과 정산 (이야기) */
  finish(st, B) {
    const s = this.s, win = B.result && B.result.win, out = { win, xp: 0, shards: 0, crystals: 0, drops: [], levels: 0, first: false, trophy: null };
    this.recordBattle(B);
    // 소모품 사용 반영
    for (const k in s.items) s.items[k] = B.items[k] != null ? B.items[k] : s.items[k];
    if (!win) { s.stats.losses++; out.xp = Math.round(this.foeXp(st) * 0.2); out.levels = this.gainXp(out.xp); this.save(); return out; }
    s.stats.wins++;
    const key = this.progKey(st.nm);
    const first = (s.story[key][st.ch] || 0) < st.k;
    out.first = first;
    if (first) s.story[key][st.ch] = st.k;
    out.xp = Math.round(this.foeXp(st) * (first ? 1.5 : 1));
    out.shards = Math.round(st.foes.length * (4 + st.lv / 2.5) * (st.boss ? 4 : st.elite ? 2 : 1) * (st.nm ? 1.4 : 1));
    if (first) out.crystals = st.boss ? (st.nm ? 15 : 10) : st.elite ? 3 : 1;
    if (st.boss) {
      const bid = st.foes[0];
      if (st.nm) s.story.nmBoss[bid] = 1;
      else if (!s.story.boss[bid]) { s.story.boss[bid] = 1; out.trophy = bid; if (!s.trophy) s.trophy = bid; }
      if (B.p.hp >= B.p.mhp) s.stats.flawless++;
      if (B.turn <= 6) s.stats.fastBoss++;
    }
    // 장비
    const dropN = st.boss ? 2 : st.elite ? 1 : (Math.random() < 0.35 ? 1 : 0);
    for (let i = 0; i < dropN; i++) out.drops.push(this.dropGear(st.lv, st.boss ? 2 : st.elite ? 1 : 0, st.nm));
    if (Math.random() < (st.boss ? 1 : 0.25)) { const it = pick(['potion', 'potion', 'tonic', 'ether', 'bomb'], Math.random); s.items[it] = (s.items[it] || 0) + 1; out.item = it; }
    s.shards += out.shards; s.crystals += out.crystals;
    out.levels = this.gainXp(out.xp);
    out.ach = this.checkAch();
    this.save();
    return out;
  },
  foeXp(st) { return st.foes.reduce((a, id) => a + (30 + st.lv * 7) * (FOES[id].boss ? 6 : FOES[id].elite ? 2.5 : 1), 0) * (st.nm ? 1.3 : 1); },
  recordBattle(B) {
    const s = this.s; if (!B) return;
    s.stats.perfect += B.stats.perfect || 0; s.stats.staggers += B.stats.staggers || 0; s.stats.kills += B.stats.kills || 0;
    s.stats.maxHit = Math.max(s.stats.maxHit, B.stats.maxHit || 0); s.stats.jackpots += B.stats.jackpots || 0;
    for (const f of B.foeQ.slice(0, B.foeIdx + 1)) s.seen[f.id] = (s.seen[f.id] || 0) + 1;
  },
  gainXp(n) {
    const s = this.s; let lv = 0;
    if (s.lvl >= LV_CAP) { s.shards += Math.round(n / 10); return 0; }
    s.xp += n;
    while (s.lvl < LV_CAP && s.xp >= xpNeed(s.lvl)) { s.xp -= xpNeed(s.lvl); s.lvl++; lv++; }
    if (s.lvl >= LV_CAP) s.xp = 0;
    return lv;
  },
  dropGear(L, minRar, nm) {
    const r = Math.random();
    let rar = r < 0.04 + (nm ? 0.04 : 0) ? 3 : r < 0.18 + (nm ? 0.08 : 0) ? 2 : r < 0.5 ? 1 : 0;
    rar = Math.max(rar, minRar || 0); if (rar === 3 && minRar < 2 && !nm) rar = 2;
    const g = rollGear(pick(['weapon', 'armor', 'charm'], Math.random), Math.min(LV_CAP, L + (nm ? 2 : 0)), rar);
    this.addBag(g);
    if (rar === 3) this.s.stats.legend++;
    return g;
  },
  addBag(g) { const s = this.s; if (s.bag.length >= BAG_MAX) { s.shards += SELL(g); g.sold = 1; return; } s.bag.push(g); },
  equip(id) {
    const s = this.s, i = s.bag.findIndex(g => g.id === id); if (i < 0) return;
    const g = s.bag[i], old = s.gear[g.slot];
    s.bag.splice(i, 1); s.gear[g.slot] = g; if (old) s.bag.push(old);
    this.save();
  },
  unequip(slot) { const s = this.s; const g = s.gear[slot]; if (!g || s.bag.length >= BAG_MAX) return; s.gear[slot] = null; s.bag.push(g); this.save(); },
  sell(id) { const s = this.s, i = s.bag.findIndex(g => g.id === id); if (i < 0) return 0; const v = SELL(s.bag[i]); s.shards += v; s.bag.splice(i, 1); this.save(); return v; },
  sellCommon() { const s = this.s; let v = 0; s.bag = s.bag.filter(g => { if (g.rar === 0) { v += SELL(g); return false; } return true; }); s.shards += v; this.save(); return v; },
  findGear(id) { const s = this.s; for (const k in s.gear) if (s.gear[k] && s.gear[k].id === id) return s.gear[k]; return s.bag.find(g => g.id === id); },
  enhance(id) {
    const g = this.findGear(id), s = this.s; if (!g || g.plus >= 10) return false;
    const c = ENH_COST(g.plus) * (1 + g.rar * 0.5); if (s.shards < c) return false;
    s.shards -= Math.round(c); g.plus++; s.stats.maxPlus = Math.max(s.stats.maxPlus, g.plus); this.save(); return true;
  },
  enhCost(g) { return Math.round(ENH_COST(g.plus) * (1 + g.rar * 0.5)); },
  buyItem(id) { const s = this.s, c = ITEM_PRICE[id]; if (s.shards < c) return false; s.shards -= c; s.items[id] = (s.items[id] || 0) + 1; this.save(); return true; },
  gearBoxCost() { return Math.round(60 + this.s.lvl * 6); },
  buyGearBox() { const s = this.s, c = this.gearBoxCost(); if (s.shards < c || s.bag.length >= BAG_MAX) return null; s.shards -= c; const g = this.dropGear(s.lvl, Math.random() < 0.3 ? 1 : 0); this.save(); return g; },
  rankCost(id) { const r = this.s.ranks[id] || 1; return r >= 5 ? null : { cr: r * 3, lv: [0, 8, 20, 35, 50][r] }; },
  rankUp(id) { const s = this.s, c = this.rankCost(id); if (!c || s.crystals < c.cr || s.lvl < c.lv) return false; s.crystals -= c.cr; s.ranks[id] = (s.ranks[id] || 1) + 1; this.checkAch(); this.save(); return true; },

/* 정지 초상: 캔버스에 리그를 한 장 그린다. o.bust → 상반신 확대 */
function paintPortrait(cv, look, o = {}) {
  if (!cv || !look) return;
  const w = +cv.dataset.w || cv.clientWidth || 80, h = +cv.dataset.h || cv.clientHeight || 100, dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const c = cv.getContext('2d'); if (!c) return;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const human = look.human || !look.draw;
  const boxH = human ? (o.bust ? 52 : 86) : (look.box ? look.box[1] : 90) * (o.bust ? 0.62 : 1);
  const boxW = human ? 46 : (look.box ? look.box[0] : 60) * (o.bust ? 0.8 : 1);
  const sc = Math.min((h - 8) / boxH, (w - 6) / boxW) * (o.sc || 1);
  const a = RIG.make({ kind: human && !look.boss ? 'hero' : 'foe', look, x: w * (o.x || 0.5), y: o.bust ? h + (human ? 34 : boxH * 0.38) * sc : h - 4, face: o.face || 1, sc, gim: o.gim || {} });
  const q = RIG.pose(a, 1000 + (o.t || 0)); if (o.pose) Object.assign(q, o.pose);
  try { RIG.draw(c, a, q, 1000 + (o.t || 0), dpr); } catch (e) { /* 그리기 실패는 빈 초상 */ }
}
function paintAll(root = document) {

    const L = lookById(cv.dataset.look); if (!L) continue;
    paintPortrait(cv, L, { bust: cv.dataset.bust === '1', face: +cv.dataset.face || 1, sc: +cv.dataset.sc || 1 });
  }
}

const QTE = {
  run(q, width) {
    return new Promise(res => {

      ar.appendChild(d);
      const cur = d.querySelector('.cur'); const dur = 1150 / Math.sqrt(FX.speed || 1); const t0 = performance.now(); let done = false, pos = 0, raf;
      const fin = v => {

      const key = e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); fin(judge()); } };

        <span class="skn">${s.tone ? `<i class="tone t${s.tone}">${tone[s.tone]}</i>` : ''}${esc(s.n)}</span><span class="skm">${s.type ? DT[s.type].i : '✦'} ${cost}</span>${!u.ok && B.cds[u.id] > 0 ? `<span class="cdv">${B.cds[u.id]}</span>` : ''}</button>`;
    };
    const items = ITEM_ORDER.filter(k => B.items[k] > 0);
    el.innerHTML = `<div class="skg">${us.map(btn).join('')}</div>
      <div class="actr"><button class="sk focus" id="aFocus" ${dis ? 'disabled' : ''} data-tip="집중: 에너지 +3, 체력 6% 회복, 정신력 +10, 보호 2(적 차례)"><span class="skn">집중</span><span class="skm">⚡+3</span></button>
      <button class="sk item" id="aItem" ${dis || !items.length || B.itemUsed >= (B.rel('belt') ? 2 : 1) ? 'disabled' : ''} data-tip="소모품 (턴을 쓰지 않는다)"><span class="skn">소모품</span><span class="skm">🎒${items.reduce((a, k) => a + B.items[k], 0)}</span></button></div>`;
    el.querySelectorAll('.skg .sk').forEach(b => b.onclick = () => { Tip.hide(); this.doAct({ k: 'skill', id: b.dataset.id }); });
    const fb = $('#aFocus'); if (fb) fb.onclick = () => { Tip.hide(); this.doAct({ k: 'focus' }); };
    const ib = $('#aItem'); if (ib) ib.onclick = () => this.itemMenu();
  },
  itemMenu() {
    const B = this.B; const items = ITEM_ORDER.filter(k => B.items[k] > 0);
    const m = modal(`<div class="itemlist">${items.map(k => `<button class="item" data-k="${k}"><b>${ITEMS[k].i} ${ITEMS[k].n}</b> ×${B.items[k]}<small>${ITEMS[k].d}</small></button>`).join('')}</div>`, { title: '소모품' });
    m.querySelectorAll('.item').forEach(b => b.onclick = async () => { closeModal(); this.busy = true; this.renderActs(); const ev = B.act({ k: 'item', id: b.dataset.k }); await this.play(ev); this.busy = false; if (B.result) this.end(); else this.renderActs(); });
  },
  retreat() {
    if (this.ended) return;
    modal(this.ctx.kind === 'lab' ? '미궁 탐색을 여기서 끝낼까요? 지금까지의 보상을 받습니다.' : '전투를 포기할까요? 보상은 없습니다.', { title: '퇴각', btns: [['퇴각', () => { this.ended = true; this.B.finish(false, 'retreat'); this.end(true); }], ['계속 싸운다', null]] });
  },
  async end(retreat) {
    if (this.finished) return; this.finished = true; this.ended = true;
    const B = this.B, ctx = this.ctx;
    await this.W(retreat ? 0 : 300);
    Stage.unmount(); FX.clear();
    if (ctx.onEnd) ctx.onEnd(B, !!retreat);
  },
};

/* ---- ui_hub.js ---- */
'use strict';
/* ===== 잔향선 · 타이틀 · 직업 선택 · 객차(허브) · 이야기 ===== */

const Screens = {
  render() {

  },

  /* ---------- 타이틀 ---------- */

      const C = CLASSES[s.cls]; const prog = Object.keys(s.story.boss).length;
      return `<div class="slot" style="--c:${C.c}"><canvas data-look="h:${s.cls}" data-bust="1" data-w="64" data-h="64"></canvas><div class="sb"><b>${C.i} ${C.n}</b><small>Lv ${s.lvl} · ${prog}/12장 · 미궁 ${s.lab.best}층 · ${fmtTime(s.playtime)}</small></div>

    }).join('');
    $('#app').innerHTML = `<div class="title"><div class="tarena" id="tarena"></div>
      <div class="tlogo"><h1>잔향선</h1><div class="tsub">ECHO LINE · 혼자 타는 밤의 열차</div></div>
      <div class="tbody"><p class="tag">가라앉은 도시를 달리는 열차. 역마다 놓지 못한 감정이 형체를 얻어 기다린다.<br>직업 하나를 골라 끝까지 혼자 싸우는 일대일 턴제 RPG.</p>
      <div class="slots">${slots}</div><div class="cloud">${Cloud.state === 'on' ? '☁ 계정에 저장 중' : '💾 이 브라우저에 저장'}</div></div></div>`;
    const last = R.cur != null && R.slots[R.cur] ? R.slots[R.cur].cls : pick(CLASS_ORDER);
    Stage.mount($('#tarena'), 'ash', Object.assign({ seed: 1 }, HERO_LOOK[last]), FOE_LOOK.clockwarden);
    Stage.fps = Game.set.fps;
    $$('[data-new]').forEach(b => b.onclick = () => { UI.newSlot = +b.dataset.new; UI.screen = 'pick'; UI.pick = UI.pick || 'hemoblade'; this.render(); });
    $$('[data-go]').forEach(b => b.onclick = () => { Game.useSlot(+b.dataset.go); UI.screen = 'hub'; UI.tab = 'story'; this.render(); });
    $$('[data-del]').forEach(b => b.onclick = () => modal('이 슬롯의 모든 진행이 사라집니다. 되돌릴 수 없어요.', { title: '슬롯 삭제', btns: [['삭제', () => { Game.deleteSlot(+b.dataset.del); this.render(); }], ['취소', null]] }));
  },

  /* ---------- 직업 선택 ---------- */
  pick() {
    const id = UI.pick, C = CLASSES[id];
    const stat = (n, v) => `<div class="statb"><span>${n}</span><div class="sbar"><i style="width:${clamp((v - 0.8) / 0.5 * 100, 8, 100)}%"></i></div></div>`;
    $('#app').innerHTML = `<div class="pickscr">
      <div class="top"><button class="ghost sm" id="pBack">← 돌아가기</button><h2>직업 선택</h2><span></span></div>
      <div class="pgrid">${CLASS_ORDER.map(k => `<button class="pc ${k === id ? 'on' : ''}" data-k="${k}" style="--c:${CLASSES[k].c}"><canvas data-look="h:${k}" data-bust="1" data-w="72" data-h="72"></canvas><b>${CLASSES[k].n}</b></button>`).join('')}</div>
      <div class="pdet" style="--c:${C.c}">
        <div class="pprev" id="pprev"></div>
        <div class="pinfo"><h2>${C.i} ${C.n} <small>${C.en}</small></h2><div class="ptag">${C.tag}</div>
          <div class="pgim"><b>고유 기믹</b><p>${esc(C.gim)}</p></div><div class="pgim"><b>패시브</b><p>${esc(C.passive)}</p></div>
          <div class="pstats">${stat('체력', C.stat.hp)}${stat('공격', C.stat.atk)}${stat('방어', C.stat.def)}${stat('속도', C.stat.spd)}</div>
          <div class="pskills">${C.skills.map(s => `<div class="psk ${s.ult ? 'ult' : ''}" data-tip="${tipAttr(s.d)}"><b>${esc(s.n)}</b><small>${s.hpCost ? `🩸${Math.round(s.hpCost * 100)}%` : `⚡${s.cost}`} · Lv${s.unlock}</small><p>${esc(s.d)}</p></div>`).join('')}</div>
          <button class="btn" id="pGo">${C.n}(으)로 여정을 시작한다</button></div></div></div>`;
    $('#pBack').onclick = () => { UI.screen = 'title'; this.render(); };
    $$('.pc').forEach(b => b.onclick = () => { UI.pick = b.dataset.k; this.render(); });
    $('#pGo').onclick = () => { Game.createSlot(UI.newSlot, id); UI.screen = 'hub'; UI.tab = 'story'; this.render(); };
    this.preview($('#pprev'), id, true);
  },
  /* 작은 무대: 영웅이 기술 동작을 차례로 보여준다 */
  preview(host, cls, cycle) {
    Stage.mount(host, 'cabin', Object.assign({ seed: 2 }, HERO_LOOK[cls]), null, { preview: true });
    Stage.me.x = Stage.W * 0.5; Stage.me.sc = Math.min(2.4, Stage.H / 120);

    clearInterval(UI.pvT);
    UI.pvT = setInterval(() => { if (!Stage.me || !host.isConnected) { clearInterval(UI.pvT); return; } const s = C.skills[i++ % C.skills.length]; RIG.play(Stage.me, s.anim === 'puppet' || s.anim === 'dashSlash' ? 'slashA' : s.anim || 'cast'); }, 1500);
  },

  /* ---------- 객차 (허브) ---------- */
  hub() {
    const s = Game.s; if (!s) { UI.screen = 'title'; return this.title(); }
    const C = CLASSES[s.cls];
    const tabs = [['story', '노선'], ['lab', '미궁'], ['char', '캐릭터'], ['shop', '매점'], ['rec', '기록'], ['set', '설정']];
    $('#app').innerHTML = `<div class="hub"><div class="hhead" style="--c:${C.c}"><canvas data-look="h:${s.cls}" data-bust="1" data-w="56" data-h="56"></canvas>
      <div class="hh"><b>${C.i} ${C.n}</b> <span class="lv">Lv ${s.lvl}</span>${bar(s.xp, xpNeed(s.lvl), 'xp', s.lvl >= LV_CAP ? 'MAX' : `${fmt(s.xp)} / ${fmt(xpNeed(s.lvl))}`)}</div>
      <div class="cur"><span data-tip="잔향 조각: 장비 강화·구매">💠 ${fmt(s.shards)}</span><span data-tip="기억 결정: 기술 단계·특성 초기화">🔷 ${fmt(s.crystals)}</span></div></div>
      <div class="tabs">${tabs.map(([k, n]) => `<button class="${UI.tab === k ? 'on' : ''}" data-tab="${k}">${n}</button>`).join('')}</div>
      <div class="tabc" id="tabc"></div></div>`;
    $$('[data-tab]').forEach(b => b.onclick = () => { UI.tab = b.dataset.tab; this.render(); });
    this['t_' + UI.tab]();
  },
  t_story() {
    const s = Game.s, nm = UI.nm && !!s.story.boss.lethe;
    const nx = Game.nextStage();
    let o = `<div class="sec">${nm ? '악몽 노선' : '잔향선 노선'} ${s.story.boss.lethe ? `<button class="ghost sm" id="nmT">${nm ? '일반 노선 보기' : '😈 악몽 노선'}</button>` : '<small>12장을 끝내면 악몽 노선이 열린다</small>'}</div>`;
    if (nx) o += `<button class="btn next" id="goNext">▶ 이어서: ${nx.ch}-${nx.k} ${esc(nx.n)} <small>Lv${nx.lv}</small></button>`;
    o += `<div class="chlist">${CHAPTERS.map(C => {
      const open = Game.chapterOpen(C.id, nm), cl = Game.cleared(C.id, nm);
      return `<div class="ch ${open ? '' : 'lock'} ${UI.openCh === C.id ? 'open' : ''}" style="--c:${C.color}"><button class="chh" data-ch="${C.id}" ${open ? '' : 'disabled'}>
        <canvas data-look="f:${C.boss}" data-bust="1" data-w="54" data-h="54" data-face="-1"></canvas><div><b>${C.id}장 ${esc(C.title)}</b><small>${esc(C.sub)} · Lv${chLv(C.id) + (nm ? NM_ADD : 0)}~</small></div>
        <span class="pips6">${Array.from({ length: 6 }, (_, i) => `<i class="${i < cl ? 'on' : ''}"></i>`).join('')}</span></button>
        ${UI.openCh === C.id && open ? `<div class="stages">${stageList(C.id, nm).map(st => { const ok = Game.stageOpen(st), done = cl >= st.k; return `<button class="stg ${done ? 'done' : ''} ${st.boss ? 'boss' : st.elite ? 'elite' : ''}" data-st="${st.id}" ${ok ? '' : 'disabled'}><b>${C.id}-${st.k}</b><span>${esc(st.n)}</span><small>Lv${st.lv} · ${st.foes.map(f => FOES[f].n).join(', ')}</small>${done ? '<i>✓</i>' : ''}</button>`; }).join('')}</div>` : ''}</div>`;
    }).join('')}</div>`;
    $('#tabc').innerHTML = o;
    const nmT = $('#nmT'); if (nmT) nmT.onclick = () => { UI.nm = !UI.nm; this.render(); };
    if (nx) $('#goNext').onclick = () => this.stageInfo(nx);
    $$('[data-ch]').forEach(b => b.onclick = () => { UI.openCh = UI.openCh === +b.dataset.ch ? null : +b.dataset.ch; this.render(); });
    $$('[data-st]').forEach(b => b.onclick = () => { const [p, k] = b.dataset.st.slice(1).split('-'); const st = stageList(+p, b.dataset.st[0] === 'n')[+k - 1]; this.stageInfo(st); });
  },
  stageInfo(st) {
    const s = Game.s, C = CH_BY_ID[st.ch];
    const uniq = [...new Set(st.foes)];
    const foes = uniq.map(id => { const D = FOES[id]; return `<div class="sfoe"><canvas data-look="f:${id}" data-w="70" data-h="80" data-face="-1"></canvas><div><b>${D.boss ? '<span class="tag boss">잔향체</span>' : D.elite ? '<span class="tag elite">정예</span>' : ''}${esc(D.n)}</b><div class="resrow">${resIcons(D.res || {})}</div><small>${esc(D.d)}</small>${GIM_HELP[id] ? `<small class="gim">기믹: ${esc(GIM_HELP[id])}</small>` : ''}</div></div>`; }).join('');
    const diff = st.lv - s.lvl;
    modal(`<div class="sinfo" style="--c:${C.color}"><div class="sh">${st.nm ? '😈 악몽 · ' : ''}${C.id}장 ${esc(C.title)} — ${st.k}. ${esc(st.n)}</div>
      <div class="sl">권장 Lv${st.lv} · 나 Lv${s.lvl} <b class="${diff > 3 ? 'bad' : diff > 0 ? 'warn' : 'good'}">${diff > 3 ? '위험' : diff > 0 ? '조금 높음' : '적정'}</b>${st.foes.length > 1 ? ` · ${st.foes.length}연전 (체력이 이어진다)` : ''}</div>
      <div class="sfoes">${foes}</div></div>`, { title: '출발 준비', btns: [['출발', () => { closeModal(); this.runStage(st); return false; }], ['닫기', null]] });
  },
  async runStage(st) {
    const s = Game.s, C = CH_BY_ID[st.ch];
    const key = (st.nm ? 'n' : 's') + st.ch;
    if (!st.nm) {
      if (st.k === 1 && !s.story.read[key + 'intro']) { await Story.play(C.intro, C); s.story.read[key + 'intro'] = 1; Game.save(); }
      if (st.story === 'mid' && !s.story.read[key + 'mid']) { await Story.play(C.mid, C); s.story.read[key + 'mid'] = 1; Game.save(); }

    }
    const cfg = Game.battleConfig(st);
    BUI.start(cfg, { kind: 'story', stage: st, theme: C.theme, title: `${st.nm ? '😈 ' : ''}${st.ch}-${st.k} ${st.n}`, onEnd: (B, retreat) => this.afterStage(st, B, retreat) });
  },
  async afterStage(st, B, retreat) {
    const s = Game.s, C = CH_BY_ID[st.ch];
    const out = retreat ? { win: false, xp: 0, retreat: 1, drops: [] } : Game.finish(st, B);
    if (retreat) { for (const k in s.items) s.items[k] = B.items[k] != null ? B.items[k] : s.items[k]; Game.save(); }
    if (out.win && st.boss && out.first && !st.nm) { UI.screen = 'hub'; Screens.render(); await Story.play(C.outro, C); }

  result(st, out, B) {

    const tr = out.trophy ? TROPHIES[out.trophy] : null;
    const nx = out.win ? Game.nextStage() : null;
    const html = `<div class="result ${out.win ? 'win' : 'lose'}"><h2>${out.win ? '승리' : out.retreat ? '퇴각' : '패배'}</h2>
      ${B ? `<div class="rstat">${B.turn}턴 · 준 피해 ${fmt(B.stats.dealt)} · 받은 피해 ${fmt(B.stats.taken)} · 완벽 방어 ${B.stats.perfect} · 흐트러짐 ${B.stats.staggers}</div>` : ''}
      <div class="rrow">${out.xp ? `<span>✨ 경험치 +${fmt(out.xp)}</span>` : ''}${out.levels ? `<span class="lvup">레벨 업! Lv ${s.lvl}</span>` : ''}${out.shards ? `<span>💠 +${out.shards}</span>` : ''}${out.crystals ? `<span>🔷 +${out.crystals}</span>` : ''}${out.item ? `<span>${ITEMS[out.item].i} ${ITEMS[out.item].n}</span>` : ''}</div>
      ${tr ? `<div class="trophy">🏆 잔향체의 유품 <b>${tr.i} ${tr.n}</b><small>${tr.d}</small></div>` : ''}
      ${drops ? `<div class="drops">${drops}</div>` : ''}
      ${out.ach && out.ach.length ? `<div class="achs">${out.ach.map(a => `<span>🏅 ${a.n}</span>`).join('')}</div>` : ''}
      ${!out.win && !out.retreat ? '<p class="mut">팁: 레벨을 올리거나, 장비를 강화하거나, 적의 기믹 안내(전투 화면 아래 줄)를 따라가 보세요.</p>' : ''}</div>`;
    const btns = [];

  },

  /* ---------- 캐릭터 ---------- */
  t_char() {
    const s = Game.s, C = CLASSES[s.cls], st = Game.stats();
    const slot = k => { const g = s.gear[k]; return g ? gearCard(g, { right: `<div class="gbt"><button class="ghost sm" data-enh="${g.id}">강화 💠${Game.enhCost(g)}</button><button class="ghost sm" data-un="${k}">해제</button></div>` }) : `<div class="gear empty">${SLOTS[k].i} ${SLOTS[k].n} 없음</div>`; };
    const sort = (UI.bagSort || 'rar');
    const bag = s.bag.slice().sort((a, b) => sort === 'rar' ? b.rar - a.rar || b.L - a.L : sort === 'lv' ? b.L - a.L : a.slot.localeCompare(b.slot));
    const trophies = Object.keys(s.story.boss).filter(k => TROPHIES[k]);
    const skills = C.skills.map(k => { const r = s.ranks[k.id] || 1, lock = k.unlock > s.lvl, cost = Game.rankCost(k.id); return `<div class="skrow ${lock ? 'lock' : ''}"><div><b>${esc(k.n)}</b> <small>${lock ? `Lv${k.unlock}에 해금` : `${r}단계 (피해 +${(r - 1) * 10}%)`}</small><p>${esc(k.d)}</p></div>${!lock && cost ? `<button class="ghost sm" data-rank="${k.id}" ${s.crystals >= cost.cr && s.lvl >= cost.lv ? '' : 'disabled'}>🔷${cost.cr}${s.lvl < cost.lv ? ` (Lv${cost.lv})` : ''}</button>` : !lock ? '<small>최대</small>' : ''}</div>`; }).join('');
    const tal = C.tal.map((tier, t) => `<div class="tal ${Game.talOpen(t) ? '' : 'lock'}"><div class="tl">Lv${TAL_LV[t]}</div>${tier.map(x => `<button class="tbtn ${s.tal[t] === x.id ? 'on' : ''}" data-tal="${t}:${x.id}" ${Game.talOpen(t) && !s.tal[t] ? '' : 'disabled'}><b>${esc(x.n)}</b><small>${esc(x.d)}</small></button>`).join('')}</div>`).join('');
    $('#tabc').innerHTML = `<div class="charscr"><div class="cprev" id="cprev"></div>
      <div class="cst"><div class="sec">능력치 <small>전투력 ${fmt(Game.power())}</small></div><div class="stt">
        <span>체력 <b>${fmt(st.mhp)}</b></span><span>공격 <b>${st.atk}</b></span><span>방어 <b>${st.def}</b></span><span>속도 <b>${st.spd}</b></span><span>치명 <b>${st.crit}%</b></span><span>치명 피해 <b>${Math.round(st.critDmg * 100)}%</b></span></div>

const Story = {
  play(lines, C) {
    return new Promise(res => {
      if (!lines || !lines.length) return res();
      const s = Game.s;
      const ov = h('div', { class: 'story' }); document.body.appendChild(ov);
      const bg = document.createElement('canvas'); bg.className = 'sbg'; ov.appendChild(bg);
      const dpr = Math.min(2, window.devicePixelRatio || 1); bg.width = innerWidth * dpr; bg.height = innerHeight * dpr; bg.style.width = '100%'; bg.style.height = '100%';
      const bc = bg.getContext('2d'); bc.setTransform(dpr, 0, 0, dpr, 0, 0); drawBG(bc, C ? C.theme : 'cabin', innerWidth, innerHeight, dpr);
      ov.insertAdjacentHTML('beforeend', `<div class="sport"><canvas id="spc" data-w="220" data-h="260"></canvas></div><div class="sbox"><div class="sname"></div><div class="stext"></div><div class="snext">▼</div></div><button class="ghost sm sskip">건너뛰기</button>`);
      let i = -1, typing = 0, full = '';
      const nextLine = () => {
        i++; if (i >= lines.length) { ov.classList.add('out'); setTimeout(() => ov.remove(), 300); return res(); }
        const [who, txt0] = lines[i]; const txt = txt0.replace('{CLASS_INTRO}', CLASS_INTRO[s.cls] || '');
        const sp = who === 'me' ? { n: '나', c: CLASSES[s.cls].c } : who === '?' ? { n: '???', c: '#ff8787' } : SPEAKER[who] || null;
        ov.querySelector('.sname').innerHTML = sp ? `<b style="color:${sp.c}">${sp.n}</b>` : '';
        const pc = $('#spc');
        let look = null;
        if (who === 'me') look = Game.look(); else if (who === '?' && C) look = C.boss === 'mirror' ? mirrorLook() : FOE_LOOK[C.boss]; else if (who === 'shadow') look = mirrorLook(); else if (NPC_LOOK[who]) look = lookById('n:' + who);
        ov.querySelector('.sport').classList.toggle('on', !!look);
        ov.querySelector('.sport').classList.toggle('foe', who === '?' || who === 'shadow');
        if (look) paintPortrait(pc, look, { bust: !(who === '?' && !look.human), face: (who === '?' || who === 'shadow') ? -1 : 1, sc: who === '?' && !look.human ? 0.85 : 1 });
        if (who === 'voice') ov.querySelector('.sport').classList.add('on', 'voice');
        else ov.querySelector('.sport').classList.remove('voice');
        full = txt; const el = ov.querySelector('.stext'); el.textContent = ''; let k = 0; clearInterval(typing);
        el.classList.toggle('narr', !who);
        typing = setInterval(() => { k += 2; el.textContent = full.slice(0, k); if (k >= full.length) clearInterval(typing); }, 22);
      };
      ov.addEventListener('click', e => { if (e.target.closest('.sskip')) { clearInterval(typing); i = lines.length; nextLine(); return; } const el = ov.querySelector('.stext'); if (el.textContent.length < full.length) { clearInterval(typing); el.textContent = full; return; } nextLine(); });
      nextLine();
    });
  },
};

    <button class="ghost sm" id="labQuit">여기서 돌아간다 (보상 받기)</button></div>`;
  $$('[data-node]').forEach(b => b.onclick = () => Lab.enter(r, r.nodes[+b.dataset.node]));
  $('#labQuit').onclick = () => modal('미궁을 나가 지금까지의 보상을 받을까요?', { title: '귀환', btns: [['돌아간다', () => { Lab.finish(r, true); return false; }], ['계속', null]] });
};

const Lab = {
  enter(r, n) {
    if (n.t === 'battle' || n.t === 'elite' || n.t === 'boss') return this.fight(r, n.t);
    if (n.t === 'rest') return modal('<p>모닥불 옆에 잠깐 앉았다.</p>', { title: '휴식', btns: [['쉰다 (체력 30%)', () => { r.hp = Math.min(r.mhp, r.hp + r.mhp * 0.3); Game.labAdvance(r); Screens.render(); }], ['단련한다 (공격 +6%)', () => { r.atkB = (r.atkB || 0) + 0.06; Game.labAdvance(r); Screens.render(); }]] });
    if (n.t === 'shop') return this.shop(r);
    if (n.t === 'event') return this.event(r);
  },
  fight(r, t, after) {
    const L = Game.labBattle(r, t);
    if (r.nextEn) { L.cfg.hero.relics = L.cfg.hero.relics.concat([]); L.cfg.mods = {}; }
    const startEn = r.nextEn || 0; r.nextEn = 0;
    const curse = r.curse || 0; r.curse = 0;
    const buff = r.nextBuff; r.nextBuff = null;
    BUI.start(L.cfg, { kind: 'lab', theme: L.theme, title: `미궁 ${r.depth}층 · ${NODE_INFO[t].n}`, onEnd: (B, retreat) => this.after(r, t, B, retreat, after) });
    const B = BUI.B; if (startEn) B.energy(startEn); if (curse) B.sp(-20 * curse); if (buff) B.bf(B.p, buff, 1, 3);
  },
  after(r, t, B, retreat, after) {
    UI.screen = 'hub'; UI.tab = 'lab';
    if (B.r._phoenix) r.relics = r.relics.filter(k => k !== 'phoenix');
    if (retreat || !B.result.win) { if (!retreat) r.hp = 0; return this.finish(r, false, B); }
    const res = Game.labAfterBattle(r, B, t);
    if (after) { Screens.render(); return after(); }
    Screens.render();
    let html = `<div class="result win"><h2>돌파</h2><div class="rrow"><span>🪙 +${res.tok}</span><span>체력 12% 회복</span></div>${res.relicMsg ? `<p>${esc(res.relicMsg)}</p>` : ''}</div>`;
    if (res.relicPick && res.relicPick.length) {
      html += `<div class="sec">유물 선택</div><div class="rpick">${res.relicPick.map(k => `<button class="rp r${RELICS[k].r}" data-rk="${k}"><b>${RELICS[k].i} ${RELICS[k].n}</b><small>${RELICS[k].d}</small></button>`).join('')}</div>`;
      const m = modal(html, { title: '', btns: [['건너뛴다', () => Screens.render()]], lock: true });
      m.querySelectorAll('[data-rk]').forEach(b => b.onclick = () => { Game.labTakeRelic(r, b.dataset.rk); closeModal(); Screens.render(); toast(`${RELICS[b.dataset.rk].n} 획득`, 'good'); });
    } else modal(html, { title: '' });
  },
  shop(r) {
    const sh = Game.labShop(r);
    const draw = () => {
      const html = `<div class="ltok">🪙 토큰 ${r.tok}</div><div class="rpick">${sh.relics.map((x, i) => `<button class="rp r${RELICS[x.k].r} ${sh.bought[i] ? 'sold' : ''}" data-i="${i}" ${sh.bought[i] || r.tok < x.price ? 'disabled' : ''}><b>${RELICS[x.k].i} ${RELICS[x.k].n}</b><small>${RELICS[x.k].d}</small><span>🪙${x.price}</span></button>`).join('')}</div>
        <div class="rpick">${[['potion', 12], ['tonic', 12], ['ether', 15]].map(([k, p]) => `<button class="rp" data-it="${k}" data-p="${p}" ${r.tok < p ? 'disabled' : ''}><b>${ITEMS[k].i} ${ITEMS[k].n}</b><small>${ITEMS[k].d}</small><span>🪙${p}</span></button>`).join('')}</div>`;
      const m = modal(html, { title: '선로 상점', btns: [['떠난다', () => { r.shop = null; Game.labAdvance(r); Screens.render(); }]], lock: true });
      m.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { const x = sh.relics[+b.dataset.i]; if (r.tok < x.price) return; r.tok -= x.price; sh.bought[+b.dataset.i] = 1; Game.labTakeRelic(r, x.k); draw(); });
      m.querySelectorAll('[data-it]').forEach(b => b.onclick = () => { const p = +b.dataset.p; if (r.tok < p) return; r.tok -= p; r.items[b.dataset.it] = (r.items[b.dataset.it] || 0) + 1; Game.save(); draw(); });
    };
    draw();
  },
  event(r) {
    const E = pick(LAB_EVENTS);
    const m = modal(`<p class="ev">${esc(E.t)}</p><div class="evo">${E.o.map((o, i) => `<button class="btn ghost" data-o="${i}" ${o.need && !o.need(r) ? 'disabled' : ''}>${esc(o.t)}</button>`).join('')}</div>`, { title: E.n, btns: [], lock: true });
    m.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
      const o = E.o[+b.dataset.o]; closeModal();
      if (o.fight) { this.fight(r, 'battle', () => { const msg = Game.labRelic(r, 0); modal(`<p>${esc(msg)}</p>`, { title: E.n }); }); return; }
      const msg = o.f(r, Game); Game.labAdvance(r); Screens.render();
      modal(`<p>${esc(msg || '')}</p>`, { title: E.n });
    });
  },
  finish(r, alive, B) {
    const out = Game.labEnd(r, alive);
    UI.screen = 'hub'; UI.tab = 'lab'; Screens.render();
    const drops = out.drops.map(g => gearCard(g)).join('');
    modal(`<div class="result ${alive ? 'win' : 'lose'}"><h2>${alive ? '귀환' : '쓰러졌다'} — ${out.depth}층</h2><div class="rrow"><span>💠 +${out.shards}</span>${out.crystals ? `<span>🔷 +${out.crystals}</span>` : ''}<span>✨ +${fmt(out.xp)}</span>${out.levels ? `<span class="lvup">레벨 업! Lv ${Game.s.lvl}</span>` : ''}</div>${drops ? `<div class="drops">${drops}</div>` : ''}${out.ach && out.ach.length ? `<div class="achs">${out.ach.map(a => `<span>🏅 ${a.n}</span>`).join('')}</div>` : ''}</div>`, { title: '미궁 결과', cls: 'wide' });
  },
};

/* ---- main.js ---- */
'use strict';
/* ===== 잔향선 · 시작 ===== */
(function boot() {
  const start = () => {
    Game.load();
    Tip.init();
    FX.init();
    if (Game.root.cur != null && Game.s) { UI.screen = 'title'; }
    Screens.render();
    Cloud.init(remote => {
      const localAt = Game.root ? (Game.root.savedAt || 0) : -1;
      if (UI.screen !== 'title' || !(remote.at > localAt)) return;
      try { Game.root = Game.migrate(JSON.parse(remote.json)); localStorage.setItem(SAVE_KEY, remote.json); } catch (e) { /* 저장소를 쓸 수 없어도 메모리 저장으로 계속한다 */ }
      Screens.render(); toast('계정에 저장된 진행을 불러왔습니다.');
    });
    let last = Date.now();
    setInterval(() => { const n = Date.now(); if (document.visibilityState === 'visible') Game.tick(Math.round((n - last) / 1000)); last = n; if (Game.s && UI.screen !== 'battle') Game.save(); }, 30000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { Game.save(); Cloud.push(); } });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
</body>
</html>
